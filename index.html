<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>जनगणना 2027 | पब्लिक डैशबोर्ड - भिनाय ब्लॉक</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>जनगणना 2027: मास्टर प्लान डैशबोर्ड</h1>
                <p>भिनाय ब्लॉक | सार्वजनिक प्रगति रिपोर्ट पोर्टल</p>
            </div>
            <a href="login.html" class="login-btn"><i class="fas fa-lock"></i> एडमिन लॉगिन</a>
        </header>

        <section class="progress-card">
            <div class="progress-info">
                <span>एकीकृत प्रगति (Overall Progress)</span>
                <span id="progress-val">0%</span>
            </div>
            <div class="progress-track">
                <div id="overall-bar"></div>
            </div>
        </section>

        <!-- Tabs for Switching Views -->
        <div class="tabs-container">
            <button id="btn-tab-progress" class="tab-btn active" onclick="switchTab('progress')">
                <i class="fas fa-chart-line"></i> जनगणना प्रगति (Census Progress)
            </button>
            <button id="btn-tab-directory" class="tab-btn" onclick="switchTab('directory')">
                <i class="fas fa-address-book"></i> सुपरवाइजर एवं प्रगणक निर्देशिका (Directory)
            </button>
            <button id="btn-tab-pdf" class="tab-btn" onclick="switchTab('pdf')">
                <i class="fas fa-file-pdf"></i> पीडीएफ रिपोर्ट (PDF Report)
            </button>
            <button id="btn-tab-report" class="tab-btn" onclick="switchTab('report')">
                <i class="fas fa-file-alt"></i> प्रोग्रेस रिपोर्ट (Detailed Report)
            </button>
        </div>

        <!-- Dynamic Content -->
        <!-- During Census Live Dashboard -->
        <div id="during-census-dashboard"></div>
        
        <!-- Personnel Directory Tab View -->
        <div id="personnel-directory-panel" style="display: none;"></div>
        
        <!-- Detailed Report Panel -->
        <div id="report-panel" style="display: none; padding: 20px;"></div>
        
        <!-- PDF Viewer Panel -->
        <div id="pdf-viewer-panel" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999; background: #fff; flex-direction: column;">
            <div style="padding: 10px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; color: var(--primary);"><i class="fas fa-file-pdf"></i> नवीनतम जनगणना रिपोर्ट</h3>
                <div>
                    <a id="pdf-download-link" href="#" target="_blank" style="margin-right: 15px; color: var(--accent); font-weight: bold; text-decoration: none;"><i class="fas fa-download"></i> डाउनलोड करें</a>
                    <button onclick="switchTab('progress')" style="background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-weight: bold;"><i class="fas fa-times"></i> बंद करें (Close)</button>
                </div>
            </div>
            <iframe id="pdf-iframe" src="" style="width: 100%; flex: 1; border: none;"></iframe>
        </div>
        
        <div id="daily-scheduler"></div>
        <div id="public-container">
            <!-- Data will be loaded from data.xml -->
            <div style="text-align: center; padding: 50px;">
                <i class="fas fa-sync fa-spin" style="font-size: 40px; color: var(--primary);"></i>
                <p style="margin-top: 10px;">डेटा लोड हो रहा है...</p>
            </div>
        </div>

        <footer style="text-align: center; margin-top: 50px; padding: 20px; color: #666; font-size: 14px; border-top: 1px solid #ddd;">
            <p>© 2026 जनगणना सेल, भिनाय ब्लॉक। सभी अधिकार सुरक्षित।</p>
            <p style="margin-top: 5px;">डेटा प्रति सप्ताह अपडेट किया जाता है।</p>
        </footer>
    </div>

    <script src="detailed_census_data.js"></script>
    <script src="script.js"></script>
</body>
</html>
