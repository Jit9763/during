<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>एडमिन पैनल | जनगणना 2027</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <script>
        // Check authentication
        if (sessionStorage.getItem('admin_logged_in') !== 'true') {
            window.location.href = 'login.html';
        }
    </script>

    <div class="container">
        <header>
            <div>
                <h1>जनगणना 2027: एडमिन पैनल</h1>
                <p>भिनाय ब्लॉक | डेटा प्रबंधन पोर्ट</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="login-btn" onclick="logout()">लॉगआउट</button>
                <a href="index.html" class="login-btn" style="background: var(--accent); color: white;">व्यू डैशबोर्ड</a>
            </div>
        </header>

        <section class="progress-card">
            <div class="progress-info">
                <span>एकीकृत प्रगति (Admin View)</span>
                <span id="progress-val">0%</span>
            </div>
            <div class="progress-track">
                <div id="overall-bar"></div>
            </div>
        </section>
        <!-- Daily Scheduler -->
        <div id="daily-scheduler"></div>

        <!-- Cloud Sync Settings (Compact) -->
        <div class="cloud-sync-bar">
            <div class="sync-label"><i class="fas fa-cloud"></i> क्लाउड सिंक:</div>
            <input type="text" id="api-url" class="sync-input" placeholder="Google Web App URL यहाँ पेस्ट करें...">
            <button class="sync-btn sync-link" onclick="saveApiUrl()"><i class="fas fa-link"></i> लिंक</button>
            <button class="sync-btn sync-push" onclick="forceCloudSync()"><i class="fas fa-upload"></i> सिंक</button>
        </div>

        <!-- Admin Content (Same as Public Container Structure) -->
        <div id="admin-container">
            <div style="text-align: center; padding: 50px;">
                <i class="fas fa-spinner fa-spin" style="font-size: 40px; color: var(--primary);"></i>
                <p style="margin-top: 10px;">डेटा लोड हो रहा है...</p>
            </div>
        </div>

        <!-- Sticky Footer Action Bar -->
        <div class="admin-action-bar">
            <button class="action-btn btn-save" onclick="saveChanges()"><i class="fas fa-save"></i> Save</button>
            <button class="action-btn btn-export" onclick="exportToJSON()"><i class="fas fa-file-export"></i> Backup</button>
            <button class="action-btn btn-report" onclick="generateReport()"><i class="fas fa-file-alt"></i> रिपोर्ट</button>
            <button class="action-btn btn-reset" onclick="resetData()"><i class="fas fa-sync"></i> Reset</button>
        </div>
    </div>

    <!-- Modal for Export -->
    <div id="export-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:1000; justify-content:center; align-items:center;">
        <div style="background:white; padding:30px; border-radius:15px; width:90%; max-width:600px;">
            <h3>बैकअप डेटा (JSON)</h3>
            <p style="font-size: 13px; margin-bottom: 10px;">आपका डेटा सुरक्षित रूप से डाउनलोड हो गया है। आप इसे Google Sheets के विकल्प के रूप में रख सकते हैं।</p>
            <textarea id="xml-output" style="display:none;"></textarea>
            <button onclick="document.getElementById('export-modal').style.display='none'" class="login-btn" style="width:100%;">बंद करें</button>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        function logout() {
            sessionStorage.removeItem('admin_logged_in');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
